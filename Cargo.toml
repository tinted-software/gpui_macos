[package]
name = "finder"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4"
env_logger = "0.11"
gpui = { package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce/" }
gpui_ce_elements = { git = "https://github.com/gpui-ce/gpui-ce/" }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/gpui-ce/gpui-ce/", features = ["font-kit"] }
palette = "0.7"

[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "packed"
